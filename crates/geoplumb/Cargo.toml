[package]
name = "geoplumb"
description = "Pull-based geospatial compute pipeline — windowed demand, caps negotiation, per-node caching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
terrano-core.workspace = true
projicio-core.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
futures = "0.3"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
projicio-core.workspace = true
tokio = { version = "1", features = ["full"] }
axum = "0.8"

[[example]]
name = "tile_server"

[[example]]
name = "pyramid"
