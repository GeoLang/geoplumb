[package]
name = "geoplumb"
description = "Pull-based geospatial compute pipeline — windowed demand, caps negotiation, per-node caching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
terrano-core.workspace = true
projicio-core.workspace = true
nubis-core.workspace = true
topoi-core.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
futures = "0.3"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
gdal = { version = "0.19", optional = true }
copc-reader = "0.9"
copc-core = "0.9"

[features]
gdal = ["dep:gdal"]

[dev-dependencies]
projicio-core.workspace = true
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tempfile = "3"
copc-writer = "0.9"

[[example]]
name = "tile_server"

[[example]]
name = "stac_tiles"

[[example]]
name = "pyramid"
