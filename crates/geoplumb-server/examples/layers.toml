# geoplumb-server layers. copy this file, edit it, and point
# GEOPLUMB_LAYERS at it. every layer ends reprojected to web mercator and
# encoded as grayscale png, so only the sources, the ops and the gray range
# the encoding stretches over go here.

# hillshade over a public copernicus dem collection. bbox is the anchor
# the grid and crs are read from, not a coverage limit: tiles past it
# search the api lazily.
[[layer]]
name = "cop-dem-hillshade"
source = { kind = "stac", api = "https://earth-search.aws.element84.com/v1", collection = "cop-dem-glo-30", assets = [
    "data",
], bbox = [7.0, 46.3, 8.0, 46.9] }

[[layer.op]]
kind = "hillshade"
azimuth = 315.0
altitude = 45.0

# ndvi from two per-band cogs, median over whatever interval the request
# asks for with ?t=, or over `datetime` when it asks for none.
[[layer]]
name = "ndvi"
source = { kind = "stac", api = "https://earth-search.aws.element84.com/v1", collection = "sentinel-2-l2a", assets = [
    "red",
    "nir",
], bbox = [7.0, 46.3, 8.0, 46.9], datetime = "2025-06-01T00:00:00Z/2025-09-01T00:00:00Z", composite = "median" }

[[layer.op]]
kind = "bandmath"
expr = "(b1 - b0) / (b1 + b0)"
min = -1.0
max = 1.0

# a local cog, hillshaded. no network, no time axis.
[[layer]]
name = "local-dem"
source = { kind = "cog", path = "/data/dem.tif" }

[[layer.op]]
kind = "hillshade"
azimuth = 315.0
altitude = 45.0

# a 5x5 mean over the dem before hillshading it, so the shading follows
# the landform rather than the noise. the window is 2 * radius + 1 cells.
[[layer]]
name = "local-dem-smoothed"
source = { kind = "cog", path = "/data/dem.tif" }

[[layer.op]]
kind = "focal"
op = "mean"
radius = 2

[[layer.op]]
kind = "hillshade"
azimuth = 315.0
altitude = 45.0

# sentinel-2 red kept only where the scl band holds a clear-ground code.
# band 1 is the second asset, and a pixel of any other code renders
# transparent. band 0, the red one, is what the png encodes.
[[layer]]
name = "s2-red-clear"
source = { kind = "stac", api = "https://earth-search.aws.element84.com/v1", collection = "sentinel-2-l2a", assets = [
    "red",
    "scl",
], bbox = [7.0, 46.3, 8.0, 46.9], datetime = "2025-06-01T00:00:00Z/2025-09-01T00:00:00Z" }
gray = { min = 0.0, max = 3000.0 }

[[layer.op]]
kind = "mask"
band = 1
valid_values = [4.0, 5.0, 6.0]

# elevation bands. `min` is inclusive, `max` exclusive, and an elevation
# in no class renders transparent. class numbers are not a measurement, so
# this layer has to say what range the png stretches over.
[[layer]]
name = "local-dem-bands"
source = { kind = "cog", path = "/data/dem.tif" }
gray = { min = 0.0, max = 4.0 }

[[layer.op]]
kind = "reclassify"
classes = [
    { min = -500.0, max = 1000.0, value = 1.0 },
    { min = 1000.0, max = 2000.0, value = 2.0 },
    { min = 2000.0, max = 9000.0, value = 3.0 },
]

# metres to feet. `sqrt`, `abs` and `log` take no constant, `add` and
# `multiply` take theirs as `op = { multiply = 3.28084 }`.
[[layer]]
name = "local-dem-feet"
source = { kind = "cog", path = "/data/dem.tif" }
gray = { min = 0.0, max = 15000.0 }

[[layer.op]]
kind = "unary"
op = { multiply = 3.28084 }

# a 3x3 gaussian blur, run as raster to tensor, convolution, tensor back
# to raster. one scale and one offset per band, defaulting to a single
# band passed through unchanged.
[[layer]]
name = "local-dem-blurred"
source = { kind = "cog", path = "/data/dem.tif" }
gray = { min = 0.0, max = 4000.0 }

[[layer.op]]
kind = "convolve"
kernel = [
    [0.0625, 0.125, 0.0625],
    [0.125, 0.25, 0.125],
    [0.0625, 0.125, 0.0625],
]

# two dem tiles stitched into one layer. a fan-in layer names `input`
# entries instead of a `source`, each with its own optional chain, and a
# `fanin` saying how they join. mosaic takes the first input with a value
# at a pixel, so wiring order is priority order.
[[layer]]
name = "dem-mosaic"
fanin = { kind = "mosaic" }
gray = { min = 0.0, max = 4000.0 }

[[layer.input]]
source = { kind = "cog", path = "/data/dem-north.tif" }

[[layer.input]]
source = { kind = "cog", path = "/data/dem-south.tif" }

# how much a summer lost against the one before it, ndvi per year and the
# later minus the earlier. combine takes exactly two inputs and runs a
# per-cell `add`, `subtract`, `multiply`, `divide`, `min` or `max` across
# them. nothing after the join fixes a range, so the layer names its own.
[[layer]]
name = "ndvi-change"
fanin = { kind = "combine", op = "subtract" }
gray = { min = -1.0, max = 1.0 }

[[layer.input]]
source = { kind = "stac", api = "https://earth-search.aws.element84.com/v1", collection = "sentinel-2-l2a", assets = [
    "red",
    "nir",
], bbox = [7.0, 46.3, 8.0, 46.9], datetime = "2025-06-01T00:00:00Z/2025-09-01T00:00:00Z", composite = "median" }

[[layer.input.op]]
kind = "bandmath"
expr = "(b1 - b0) / (b1 + b0)"
min = -1.0
max = 1.0

[[layer.input]]
source = { kind = "stac", api = "https://earth-search.aws.element84.com/v1", collection = "sentinel-2-l2a", assets = [
    "red",
    "nir",
], bbox = [7.0, 46.3, 8.0, 46.9], datetime = "2024-06-01T00:00:00Z/2024-09-01T00:00:00Z", composite = "median" }

[[layer.input.op]]
kind = "bandmath"
expr = "(b1 - b0) / (b1 + b0)"
min = -1.0
max = 1.0

# a local geojson file burned to a raster. the collection is read whole at
# startup and its coordinates are lon/lat per rfc 7946. features are not
# pixels, so the chain needs a `rasterize`: it burns `{ constant = 1.0 }`
# for every feature, or a numeric property per feature as below, skipping
# the features without it.
[[layer]]
name = "parcels"
source = { kind = "geojson", path = "/data/parcels.geojson" }
gray = { min = 0.0, max = 100.0 }

[[layer.op]]
kind = "rasterize"
burn = { property = "depth" }

# the roads whose `highway` property is residential, their properties
# rewritten before the burn. a vector op leaves features behind, so the
# chain still ends in a `rasterize`. `vec_schema` drops first, then
# renames what survives, then adds the defaults a feature lacks, and a
# third vector op, `vec_clip`, intersects every feature with the polygons
# of a geojson file read at startup.
[[layer]]
name = "residential-lanes"
source = { kind = "geojson", path = "/data/roads.geojson" }
gray = { min = 0.0, max = 4.0 }

[[layer.op]]
kind = "vec_filter"
field = "highway"
equals = "residential"

[[layer.op]]
kind = "vec_schema"
drop = ["surface"]
rename = { name = "label" }
add = { lanes = 2 }

[[layer.op]]
kind = "rasterize"
burn = { property = "lanes" }

# a las point cloud gridded to a raster. the file is read whole at startup
# and `crs` names the epsg its coordinates are in, which las does not
# carry in a form the reader trusts. points are not pixels, so the chain
# needs an `idw`, and interpolated heights are no op's range, so the layer
# says what the png stretches over. every idw field is optional and falls
# back to the element's own default. `radius_px` is in output pixels, so
# every zoom searches a comparable neighbourhood.
[[layer]]
name = "lidar-ground"
source = { kind = "las", path = "/data/ground.las", crs = 26910 }
gray = { min = 0.0, max = 500.0 }

[[layer.op]]
kind = "idw"
power = 2.0
radius_px = 8.0
min_points = 3
